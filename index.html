<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART REVESTIME | Wallet</title>
  <meta name="theme-color" content="#08150f">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #08150f;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      border: 1px solid #244436;
      border-radius: 18px;
      background: #102019;
      text-align: center;
    }

    .logo {
      color: #70e1b2;
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    p {
      color: #bdcfc5;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      background: #70e1b2;
      color: #08150f;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 18px;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .notice {
      margin-top: 20px;
      font-size: 12px;
      color: #9fb5a8;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">SMART REVESTIME</div>

    <h2>Connect Your Wallet</h2>

    <p>
      Connect a compatible wallet to access supported blockchain features.
    </p>

    <button id="connectWallet" type="button">
      Connect Wallet
    </button>

    <div id="status" role="status" aria-live="polite">
      Wallet not connected
    </div>

    <div class="notice">
      Connecting does not authorize a transaction.
      Never share your recovery phrase or private key.
    </div>
  </main>

  <script type="module">
    const button = document.getElementById("connectWallet");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {
      status.textContent = "Wallet connection setup is required.";
      button.disabled = true;

      try {
        const { createAppKit } = await import(
          "https://esm.sh/@reown/appkit@1.7.8"
        );

        const { EthersAdapter } = await import(
          "https://esm.sh/@reown/appkit-adapter-ethers@1.7.8"
        );

        const { mainnet, bsc } = await import(
          "https://esm.sh/@reown/appkit/networks"
        );

        const projectId = "494e634590abe6a66a9d425c48057a8f";

        if (
          !projectId ||
          projectId === "PASTE_YOUR_REOWN_PROJECT_ID_HERE"
        ) {
          status.textContent =
            "Setup required: add your Reown Project ID in the code.";
          return;
        }

        const appKit = createAppKit({
          adapters: [new EthersAdapter()],
          networks: [mainnet, bsc],
          projectId,
          metadata: {
            name: "SMART REVESTIME",
            description: "Connect your blockchain wallet",
            url: window.location.origin,
            icons: []
          },
          features: {
            analytics: false
          }
        });

        await appKit.open();
        status.textContent =
          "Wallet selection opened. Follow the prompts in your wallet.";
      } catch (error) {
        console.error("Wallet setup error:", error);
        status.textContent =
          "Wallet setup failed. Check the Project ID and reload the page.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
